# Render Blueprint for the Kirayla Spring Boot API (backend/).
# Free web service in Frankfurt. The database is NOT created here: it is an external Neon Postgres
# whose connection string is entered in the Render dashboard (never committed to git).
services:
  - type: web
    name: kirayla-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Neon connection string, e.g. postgresql://USER:PASSWORD@ep-xxxx.eu-central-1.aws.neon.tech/kirayla?sslmode=require
      # Converted to JDBC at startup. Alternatively set JDBC_DATABASE_URL / _USERNAME / _PASSWORD.
      - key: DATABASE_URL
        sync: false
      # HMAC key for JWTs — Render generates a random value once.
      - key: JWT_SECRET
        generateValue: true
      # Browser origins allowed by CORS (comma-separated Spring origin patterns),
      # e.g. https://<your-vercel-domain> (the domain Vercel assigned to the frontend project)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Public URL of this service (shown by Render after creation), used to build uploaded-photo URLs
      - key: PUBLIC_BASE_URL
        sync: false
      # Optional real (writable) admin created on first start; the seeded demo admin is read-only.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
