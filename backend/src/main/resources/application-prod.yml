# Production (Render + Neon). DATABASE_URL (postgresql://...) is converted to JDBC by
# DatabaseUrlEnvironmentPostProcessor; JWT_SECRET is required (the app refuses to start without it).
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000

logging:
  level:
    root: INFO

# Behind Render's proxy. "native" = Tomcat's RemoteIpValve: the client address is the right-most
# X-Forwarded-For entry that is not one of our own proxies (private ranges by default), so a header the
# client sends itself is never believed. The login rate limit keys on that address.
server:
  forward-headers-strategy: native
