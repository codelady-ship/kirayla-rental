name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: chmod +x mvnw && ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports

  # The deploy target is a Docker image on Render talking to PostgreSQL (Neon). The unit tests use H2,
  # so this job builds the real image and boots it with the prod profile against a real PostgreSQL:
  # Flyway V1–V3 must apply, the seed must load and the demo logins must work.
  docker-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kirayla
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: kirayla
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kirayla" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image (same Dockerfile Render uses)
        run: docker build -t kirayla-api ./backend
      - name: Start with the prod profile
        run: |
          docker run -d --name api --network host \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e DATABASE_URL='postgresql://kirayla:ci-only-password@localhost:5432/kirayla' \
            -e JWT_SECRET='ci-only-not-a-real-secret-0123456789' \
            -e CORS_ALLOWED_ORIGINS='https://example.test' \
            -e PUBLIC_BASE_URL='http://localhost:8080' \
            -e KIRAYLA_DEMO_CLEANUP_INITIAL_DELAY=PT20S \
            kirayla-api
          for i in $(seq 1 60); do curl -sf http://localhost:8080/actuator/health && break; sleep 3; done
          curl -sf http://localhost:8080/actuator/health
      - name: Seed, auth and sandbox work on PostgreSQL
        run: |
          set -euo pipefail
          test "$(curl -sf 'http://localhost:8080/api/listings?size=1' | jq .totalElements)" = "40"
          test "$(curl -sf http://localhost:8080/api/categories | jq length)" = "10"
          test "$(curl -sf 'http://localhost:8080/api/listings?city=Bak%C4%B1&maxPrice=20&sort=price_asc' | jq '.content | length > 0')" = "true"
          TOKEN=$(curl -sf -X POST http://localhost:8080/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"demo-admin@kirayla.az","password":"Demo1234!"}' | jq -r .accessToken)
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/admin/stats -H "Authorization: Bearer $TOKEN")" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PATCH http://localhost:8080/api/admin/listings/1 \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"status":"HIDDEN"}')" = "403"
          # a new account can book: identity columns continue after the seeded ids
          USER=$(curl -sf -X POST http://localhost:8080/api/auth/register -H 'Content-Type: application/json' \
            -d '{"name":"CI Renter","email":"ci-renter@kirayla.test","password":"Sinaq12345","city":"Bakı"}' | jq -r .accessToken)
          FROM=$(date -d '+200 days' +%F); TO=$(date -d '+201 days' +%F)
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/bookings -H "Authorization: Bearer $USER" \
            -H 'Content-Type: application/json' -d "{\"listingId\":5,\"startDate\":\"$FROM\",\"endDate\":\"$TO\"}")" = "201"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/bookings -H "Authorization: Bearer $USER" \
            -H 'Content-Type: application/json' -d "{\"listingId\":5,\"startDate\":\"$FROM\",\"endDate\":\"$TO\"}")" = "409"
          # dates survive the round trip unchanged (container OS clock is UTC, the app zone is Asia/Baku)
          test "$(curl -sf http://localhost:8080/api/bookings/mine -H "Authorization: Bearer $USER" | jq -r '.[0].startDate + " " + .[0].endDate')" = "$FROM $TO"
          test "$(curl -sf http://localhost:8080/api/listings/5 | jq --arg f "$FROM" --arg t "$TO" '[.unavailable[] | select(.from == $f and .to == $t)] | length')" = "1"
          # the public demo protects itself: other seed users cannot sign in, the demo admin sees masked e-mails only,
          # the demo host cannot archive seeded listings, refresh tokens are single-use
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"leyla@kirayla.az","password":"Demo1234!"}')" = "401"
          USERS=$(curl -sf 'http://localhost:8080/api/admin/users?size=100' -H "Authorization: Bearer $TOKEN")
          test "$(echo "$USERS" | grep -c 'ci-renter@kirayla.test' || true)" = "0"
          echo "$USERS" | grep -q 'c\*\*\*@kirayla.test'
          test "$(curl -sf 'http://localhost:8080/api/admin/users?q=ci-renter' -H "Authorization: Bearer $TOKEN" | jq .totalElements)" = "0"
          HOST=$(curl -sf -X POST http://localhost:8080/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"rashad@kirayla.az","password":"Demo1234!"}')
          test "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE http://localhost:8080/api/listings/1 \
            -H "Authorization: Bearer $(echo "$HOST" | jq -r .accessToken)")" = "403"
          REFRESH=$(echo "$HOST" | jq -r .refreshToken)
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/auth/refresh -H 'Content-Type: application/json' -d "{\"refreshToken\":\"$REFRESH\"}")" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/auth/refresh -H 'Content-Type: application/json' -d "{\"refreshToken\":\"$REFRESH\"}")" = "401"
          # the scheduled cleanup's SQL runs on PostgreSQL without errors
          for i in $(seq 1 20); do docker logs api 2>&1 | grep -q 'Demo cleanup ran' && break; sleep 3; done
          docker logs api 2>&1 | grep -q 'Demo cleanup ran'
          ! docker logs api 2>&1 | grep -q 'Demo cleanup failed'
          # CORS: only the configured origin
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/categories -H 'Origin: https://evil.test')" = "403"
          curl -s -D - -o /dev/null http://localhost:8080/api/categories -H 'Origin: https://example.test' | grep -qi '^access-control-allow-origin: https://example.test'
      - if: always()
        run: docker logs api | tail -n 150
