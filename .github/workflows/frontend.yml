name: Frontend CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Built exactly like a deploy made before the API exists: NEXT_PUBLIC_API_URL is NOT set.
      - name: Build without an API
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      - name: No API configured → no API calls, demo snapshot only
        run: |
          npx playwright install --with-deps chromium
          nohup npm start > web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/az > /dev/null && break; sleep 2; done
          node scripts/no-api-check.mjs
      - if: failure()
        run: tail -n 100 web.log

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start API (H2 + seed)
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B -q -DskipTests package
          nohup java -jar target/kirayla-api.jar > api.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:8080/actuator/health && break; sleep 2; done
      - name: Build and start web
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          nohup npm start > web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/az > /dev/null && break; sleep 2; done
      - run: npx playwright test
        working-directory: frontend
      - if: failure()
        run: tail -n 200 backend/api.log frontend/web.log
